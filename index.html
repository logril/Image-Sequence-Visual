<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Sequence Visualization</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
    }

    img {
      max-width: 90%;
      border: 1px solid #ccc;
    }

    button {
      margin: 10px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

<h2>Image Sequence Visualization</h2>

<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>

<br><br>

<div style="display: flex; justify-content: center; gap: 40px;">

  <div>
    <input
      type="range"
      id="sliderA"
      min="1"
      max="16"
      step="1"
      value="1"
      oninput="setFrameA(this.value)"
    >
    <br><br>
    
    <img id="viewerA">
    
  </div>

  <div>
    <input
      type="range"
      id="sliderB"
      min="1"
      max="16"
      step="1"
      value="1"
      oninput="setFrameB(this.value)"
    >
    <br><br>
    
    <img id="viewerB">
  </div>


<script>
  // ---- CONFIGURATION ----
  const frameCount = 16;      // change this src="Fig_KH/Fig_001.png"
  const fps = 1;            // frames per second
  //const prefix = "frame_";
  //const extension = ".jpg";
  //const folder = "images/";
  // -----------------------

  const framesA = [];
  const framesB = [];
  for (let i = 1; i <= frameCount; i++) {
    framesA.push(
      "Fig_KH/Fig_" + String(i).padStart(3, "0") + ".png"
    );
    framesB.push(
      "Fig_agg/Fig_" + String(i).padStart(3, "0") + ".png"
    );
  }

  let indexA = 0;
  let indexB = 0;
  let timer = null;

  function play() {
    if (timer) return;
    timer = setInterval(() => {
      showFrameA((indexA + 1) % framesA.length);
      showFrameB((indexB + 1) % framesB.length);
    }, 1000 / fps);
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }

  function showFrameA(i) {
    indexA = i;
    document.getElementById("viewerA").src = framesA[indexA];
    document.getElementById("sliderA").value = indexA + 1;
  }

  function showFrameB(i) {
    indexB = i;
    document.getElementById("viewerB").src = framesB[indexB];
    document.getElementById("sliderB").value = indexB + 1;
  }

  function setFrameA(sliderValueA) {
    pause();               // stop animation when scrubbing
    showFrame(sliderValueA - 1);
  }

  function setFrameB(sliderValueB) {
    pause();               // stop animation when scrubbing
    showFrame(sliderValueB - 1);
  }

</script>

</body>
</html>
