<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Sequence Visualization</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
    }

    img {
      max-width: 90%;
      border: 1px solid #ccc;
    }

    button {
      margin: 10px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

<h2>Image Sequence Visualization</h2>

<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>

<br><br>

<input
  type="range"
  id="slider"
  min="1"
  max="16"
  step="1"
  value="1"
  oninput="setFrame(this.value)"
>
<br><br>

<img id="viewer" src="Fig_KH/Fig_001.png">

<script>
  // ---- CONFIGURATION ----
  const frameCount = 16;      // change this
  const fps = 1;            // frames per second
  const prefix = "Fig_";
  const extension = ".png";
  const folder = "Fig_KH/";
  // -----------------------

  const frames = [];
  for (let i = 1; i <= frameCount; i++) {
    frames.push(
      folder + prefix + String(i).padStart(3, "0") + extension
    );
  }

  let index = 0;
  let timer = null;

  function play() {
    if (timer) return;
    timer = setInterval(() => {
      showFrame((index + 1) % frames.length);
    }, 1000 / fps);
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }

  function showFrame(i) {
    index = i;
    document.getElementById("viewer").src = frames[index];
    document.getElementById("slider").value = index + 1;
  }

  function setFrame(sliderValue) {
    pause();               // stop animation when scrubbing
    showFrame(sliderValue - 1);
  }

</script>

</body>
</html>
